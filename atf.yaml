api:
  # Typed API bootstrap. Acceptance is explicit, offline and deterministic;
  # live requires -Datf.api.live.optIn=true (or ATF_API_LIVE_OPT_IN=true).
  baseUri: https://gorest.co.in
  defaultAuthProfile: default
  timeout: PT20S
  retryStatuses: [429]
  maxAttempts: 2
  transport: acceptance

validation:
  # Warnings are opt-in at the concrete validation level; the global default
  # remains strict so contract violations are not hidden.
  warningMode: false

reporting:
  assertionMaxDisplayCharacters: 240
  # Maximum characters kept in each redacted request/response JSON code block.
  # The block remains scrollable; this bounds artifact size and DOM cost.
  bodyMaxDisplayCharacters: 12000
  console:
    # Compact lifecycle messages are useful both from Maven and IntelliJ.
    enabled: true
    # Pretty, redacted request/response bodies are visible when enabled.
    detailsEnabled: true
  extent:
    # Direct JUnit resource tests may open the same configured report session.
    # Set to false to keep UsersApiTests/PostsApiTests console-only.
    enabled: true
    # Relative paths are resolved from this file, not IntelliJ's working directory.
    outputDirectory: artifacts/reports
    fileName: api-atf-extent-report.html
    # Produces api-atf-extent-report_yyyy-MM-dd_HH-mm-ss-SSS.html.
    # Set to false when a stable, replaceable file name is required.
    timestampEnabled: true
    timestampPattern: yyyy-MM-dd_HH-mm-ss-SSS
    timestampZone: system

ui:
  # setup -> API scenario collection -> mock YAML -> Extent -> UI deep validation
  browser: chromium
  baseUrl: about:blank
  headless: false
  timeout: PT10S
  navigationTimeout: PT45S
  viewport:
    width: 1440
    height: 900
  screenshotOnFailure: true
  screenValidation:
    # One native Base64 screenshot link backs any number of assertions captured
    # from the same visual state. The disclosure stays collapsed by default.
    enabled: true
    fullPage: false
  apiSetup:
    # This is the executable API collection. Add/remove families here; the
    # UI report and mock-driven deep validator discover the resulting routes.
    scenarioFamilies: [posts, users, requests, headers, flows, negative, lifecycle]
  audit:
    # Optional existing Extent input for ExistingExtentReportExploratoryTest.
    # Keep this unset when the UI test should consume a freshly generated API report.
    # inputReport: artifacts/reports/api-atf-extent-report.html
    suites:
      users-posts:
        scenarioFamilies: [users, posts]
        tabs: [tests, overview, categories, fails, evidence]
        validators: [setup, tests, request-contract, overview, categories, fails, duration, responsive, evidence, cross-tab]
        depth: deep
        source: yaml
      all-api:
        scenarioFamilies: [posts, users, requests, headers, flows, negative, lifecycle]
        tabs: [tests, overview, categories, fails, evidence]
        validators: [setup, tests, request-contract, overview, categories, fails, duration, responsive, evidence, cross-tab]
        depth: deep
        source: yaml
  report:
    # UI validation artifacts are isolated from the canonical API reports.
    directory: artifacts/reports/ui
    filePrefix: ui-atf-extent-report_

