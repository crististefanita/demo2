ui:
  browser: chromium
  baseUrl: about:blank
  headless: true
  timeout: PT10S
  navigationTimeout: PT45S
  viewport:
    width: 1440
    height: 900
  # Page zoom is intentionally configurable: 70% fits more report evidence
  # into one screenshot while keeping the Playwright viewport dimensions stable.
  zoomPercent: 70
  screenshotOnFailure: true
  screenValidation:
    fullPage: false
  apiSetup:
    scenarioFamilies: [posts, users, requests, headers, flows, negative, lifecycle]
  audit:
    suites:
      users-posts:
        scenarioFamilies: [users, posts]
        tabs: [tests, overview, categories, fails, evidence]
        validators: [setup, tests, request-contract, overview, categories, fails, duration, responsive, evidence, cross-tab]
        depth: deep
        source: yaml
      all-api:
        scenarioFamilies: [posts, users, requests, headers, flows, negative, lifecycle]
        tabs: [tests, overview, categories, fails, evidence]
        validators: [setup, tests, request-contract, overview, categories, fails, duration, responsive, evidence, cross-tab]
        depth: deep
        source: yaml
  report:
    directory: target/reporting-ui-artifacts
    filePrefix: ui-atf-extent-report_
